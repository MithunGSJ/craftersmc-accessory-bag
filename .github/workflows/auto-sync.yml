name: Automated 30-Minute Wiki & Pricing Sync

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-test:
    name: Sync CraftersMC Wiki, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Wiki Data & Accessories Sprites
        run: npm run sync:wiki

      - name: Sync Live Bazaar & Auction Pricing
        run: npm run sync:pricing
        env:
          CRAFTERS_API_KEY: ${{ secrets.CRAFTERS_API_KEY }}

      - name: Run Vitest Regression Suite
        run: npm test

      - name: Verify Strict TypeScript & Production Build
        run: npm run build

      - name: Commit and push asset and catalog changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/icons/accessories/ src/data/pricingSnapshot.json src/data/wikiAccessories.json src/data/wikiRecipes.json
          if git diff --staged --quiet; then
            echo "No changes detected. Catalog, sprites, and prices are up to date."
          else
            git commit -m "chore(sync): automated 30-min wiki, sprites & pricing sync [skip ci]"
            git push
          fi
